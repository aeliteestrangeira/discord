name: Release Windows Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "Tag $tag does not match package version $pkg" }

      - name: Install Python build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.21.0

      - name: Run Python tests
        run: python verify_architecture.py

      - name: Build standalone Flask backend
        shell: pwsh
        run: ./desktop/build_backend.ps1

      - name: Smoke test packaged TLS helper
        shell: pwsh
        run: |
          $env:DISCORD_INSTANCE_DIR = Join-Path $env:RUNNER_TEMP "discord-instance"
          New-Item -ItemType Directory -Force -Path $env:DISCORD_INSTANCE_DIR | Out-Null
          ./build/backend/discord-tls.exe
          if (-not (Test-Path (Join-Path $env:DISCORD_INSTANCE_DIR "tls/server-cert.pem"))) { throw "TLS certificate missing" }
          if (-not (Test-Path (Join-Path $env:DISCORD_INSTANCE_DIR "tls/server-key.pem"))) { throw "TLS key missing" }

      - name: Smoke test packaged WSGI backend
        shell: pwsh
        run: |
          $instance = Join-Path $env:RUNNER_TEMP "discord-instance"
          $runtime = Join-Path $env:RUNNER_TEMP "discord-runtime"
          $config = Join-Path $env:RUNNER_TEMP "discord-config"
          New-Item -ItemType Directory -Force -Path $instance, $runtime, $config | Out-Null
          $env:APP_HOSTNAME = "discord"
          $env:DISCORD_INSTANCE_DIR = $instance
          $env:DISCORD_RUNTIME_DIR = $runtime
          $env:DISCORD_PRIVATE_CONFIG_DIR = $config
          $env:DISCORD_PRIVATE_ENV_FILE = Join-Path $config "SUPABASE_PRIVILEGED.env"
          $port = 18443
          $cert = Join-Path $instance "tls/server-cert.pem"
          $key = Join-Path $instance "tls/server-key.pem"
          $stdout = Join-Path $env:RUNNER_TEMP "discord-backend.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "discord-backend.stderr.log"
          $args = @(
            "--bind", "127.0.0.1", "--port", [string]$port,
            "--tls-cert", $cert, "--tls-key", $key,
            "--instance-marker", "ci-smoke"
          )
          $process = Start-Process -FilePath ./build/backend/discord-backend.exe -ArgumentList $args -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) {
                $detail = (Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue)
                throw "Packaged backend exited early (code=$($process.ExitCode)): $detail"
              }
              $resolve = ("discord:{0}:127.0.0.1" -f $port)
              $body = & curl.exe -ksS --max-time 2 --resolve $resolve "https://discord:$port/api/desktop/health" 2>$null
              if ($LASTEXITCODE -eq 0 -and $body) {
                try {
                  $json = $body | ConvertFrom-Json
                  if ($json.ok -eq $true -and $json.service -eq "discord-local" -and $json.marker -eq "ci-smoke") {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Packaged WSGI backend did not become healthy." }
            if (Select-String -LiteralPath $stderr -Pattern "development server" -Quiet -ErrorAction SilentlyContinue) {
              throw "Werkzeug development server warning detected; production WSGI migration failed."
            }
            Write-Host "Packaged Hypercorn WSGI/TLS health check passed."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Desktop JavaScript checks
        run: npm run desktop:check

      - name: Build NSIS installer
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $items = Get-ChildItem out -File | Where-Object { $_.Extension -in @('.exe', '.yml', '.blockmap') }
          if (-not $items) { throw "No release artifacts found" }
          $lines = foreach ($item in $items) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content -LiteralPath out/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            out/*.exe
            out/*.yml
            out/*.blockmap
            out/SHA256SUMS.txt

      - name: Upload build artifacts for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: discord-desktop-windows
          path: |
            out/*.exe
            out/*.yml
            out/*.blockmap
            out/SHA256SUMS.txt
