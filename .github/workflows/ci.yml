name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Repository and Pages tests
        run: python -m unittest discover -s test -p "test_*.py" -v
      - name: JavaScript syntax
        run: find assets/js -type f -name '*.js' -exec node --check {} \;
      - name: Build deployable Pages artifact
        run: python priv/scripts/build_pages.py --output _site
