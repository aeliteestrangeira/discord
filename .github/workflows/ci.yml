name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python tests
        run: python verify_architecture.py
      - name: Public preflight
        run: python priv/scripts/preflight.py
      - name: JavaScript syntax
        run: npm run desktop:check --ignore-scripts
      - name: Verify public integrity manifest
        run: python verify_integrity.py
