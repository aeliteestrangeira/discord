<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Administrador{% endblock %}</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Controle local</div>
    <nav class="nav" aria-label="Administração">
      <a href="/admin">Visão geral</a>
      <a href="/admin/config">Configuração</a>
      <a href="/admin/users">Usuários</a>
      <a href="/admin/tables">Tabelas</a>
      <a href="/admin/sql">SQL</a>
      <a href="/admin/audit">Auditoria</a>
      <a href="/">Aplicação</a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1>{% block heading %}Administrador{% endblock %}</h1>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <button class="secondary" type="submit">Sair ({{ username }})</button>
      </form>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
