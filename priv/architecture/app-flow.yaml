version: 1
principles:
  - server_side_identity_for_authorization
  - default_deny
  - centralized_access_control
  - client_validation_for_ux_server_validation_for_security
  - reuse_server_state_instead_of_client_supplied_identity
  - separate_presentation_application_and_persistence_concerns
  - database_schema_verified_before_registration
  - trusted_server_registration_authority_when_configured
  - public_signup_only_without_admin_authority
  - confirmation_delivery_is_retryable_after_persistence
  - unconfirmed_email_login_maps_to_restricted_pending_session
  - supabase_schema_catalog_is_source_of_truth_for_remote_tables
  - local_control_plane_is_not_published_as_supabase_tables
  - migration_history_is_checksum_pinned
  - gmail_oauth_is_configuration_only_until_explicitly_enabled
pages:
  login:
    route: /
    actor: anonymous
    source: login.html
    password_auth:
      primary_authority: Supabase Auth
      email_not_confirmed:
        credential_proof_source: Supabase Auth password grant rejection after credential validation
        local_role: pending
        provider_tokens_issued: false
        identity_lookup: server-side PostgreSQL read-only
      all_other_provider_errors: deny
    next:
      user: /channels/@me
      pending: /channels/@me
      admin: /admin
  register:
    route: /register.html
    actor: anonymous
    source: register.html
    persistence_precondition:
      authority: PostgreSQL catalog
      repair: allowlisted idempotent migrations 000-008 with SHA-256 ledger
      local_version_marker_authoritative: false
    creation:
      human_verification: hCaptcha verified server-side before Auth side effects
      preferred_when_admin_configured: trusted Auth Admin create_user, email_confirm=false
      confirmation_delivery: POST /auth/v1/resend type=signup after persistence
      confirmation_delivery_failure: keep account pending and allow retry
      fallback_without_admin_authority: Supabase public sign-up
      admin_key_exposed_to_browser: false
    next:
      confirmed_user: /channels/@me
      pending_user: /channels/@me
  channels:
    route: /channels/@me
    source: channels.html
    localization:
      locale: pt-BR
      source_owned: true
      runtime_translation_script: false
      preserves_dom_classes_styles_order: true
    css:
      base: discord.css
      delta: channels.css
    allow:
      - pending
      - user
    deny:
      - anonymous
      - admin
    visible_from_anonymous_navigation: false
    dynamic_profile:
      username: server_session.username
      avatar: captured_static_avatar
      status: Online
    email_verification:
      banner_visible_when: server_session.email_confirmed == false
      banner_action: open captured Verification Required flow
      verification_kind_source: server_session.verification_kind
      resend_endpoint: POST /api/auth/resend-confirmation
      refresh_endpoint: POST /api/auth/verification/status
      change_email_endpoint: POST /api/auth/change-email
      change_email_password_proof: Supabase Auth
      change_email_actor_after_success: pending
      change_email_old_provider_tokens: discarded
    friend_requests:
      create_endpoint: POST /api/friends/requests
      pending_endpoint: GET /api/friends/requests/pending
      cancel_endpoint: POST /api/friends/requests/:request_id/cancel
      accept_endpoint: POST /api/friends/requests/:request_id/accept
      ignore_endpoint: POST /api/friends/requests/:request_id/ignore
      target_resolution: server-side public.profiles.username
      pending_projection: server-side sent + received peer profile join
      persistence: public.friend_requests
      captcha: required before username lookup
      pending_rate_limit_result: verification_required
      pending_tab_visible_when: sent_pending_count + received_pending_count > 0
      pending_badge_count: received_pending_count
      friends_sidebar_badge_count: received_pending_count
      initial_hydration: server-side before /channels/@me response, then inert JSON snapshot for frontend state
      action_tooltip_state: single shared tooltip actor in popover-portal
      pending_cancel_semantics: delete outgoing pending row
      pending_accept_semantics: pending -> accepted
      pending_ignore_semantics: delete incoming pending row
      ui_states:
        - neutral
        - error
        - success
        - pending-list
    first_server_modal:
      initial_state: open
      enabled_actions:
        - close
      other_actions: inert
    server_entry:
      add_server_selector: guildsnav___create-join-button
      tutorial:
        indicator_scope: tutorialContainer__650eb > indicator_ffc7aa
        popout_classes: captured popoutRoot__22234 hierarchy
        persistence: per-user visual-only localStorage
        first_open_marks_seen: true
        skip_all_removes_tutorial_indicators: true
      create_server_modal:
        overlay: scrim__40128 + layer_bc663c
        modal_classes: modal__024d4 root__49fc1 small__49fc1 rootWithShadow__49fc1
        state_authority: one create-server state object owned by server-entry.js
        steps:
          templates:
            choices: [custom, gaming, friends, study_group, school_club, local_community, artists_creators]
            next: audience
            join_server: join
          join:
            source: supplied captured Join a Server modal hierarchy
            field: invite_link
            samples_fill_field: true
            back: templates
            submit: inert until invite backend is implemented
          audience:
            choices: [friends, community, skipped]
            back: templates
            next: customize
          customize:
            fields: [server_name, optional_server_icon]
            back: audience
            submit: POST /api/guilds multipart/form-data
        transition_animation: slideWrapper__024d4 with Web Animations API; existing CSS classes unchanged
        enabled_actions:
          - close
          - scrim_close
          - escape_close
          - template_select
          - join_server_open
          - join_sample_select
          - audience_select
          - back
          - create
        persistence:
          guild: public.guilds
          membership: public.guild_members
          default_channel: public.guild_channels
          icon: validated raster bytes stored server-side in PostgreSQL
        post_create: /channels/:guild_id/:default_channel_id
      guild_shell:
        source: guild.html
        css:
          base: channels.css
          delta: guild.css
        localization:
          locale: pt-BR
          source_owned: true
        server_capture_dedupe:
          images_reused_by_sha256: 195
          images_new: 7
          fonts_reused_by_sha256: 55
          fonts_new: 0
        sidebar_order: guilds before add/discover/download controls
        navigation: membership-scoped /channels/:guild_id/:channel_id
        voice_runtime:
          permission_prompt: native navigator.mediaDevices.getUserMedia audio request
          media_transport: WebRTC RTCPeerConnection
          signaling: same-origin REST through Flask Actor/Policy boundary
          endpoints:
            - POST /api/voice/join
            - POST /api/voice/state
            - POST /api/voice/signal
            - POST /api/voice/leave
          ice_configuration: VOICE_ICE_SERVERS_JSON with STUN fallback and TURN support
          persistence:
            sessions: public.voice_sessions ephemeral heartbeat rows
            signals: public.voice_signals short-lived offer/answer/ICE rows
          authorization: guild membership + voice channel type + owned voice session
          ui:
            captured_source_modified: false
            dynamic_classes: captured Discord class hierarchy
            joined_user_list: under selected voice channel
            connection_panel: Voice Connected + channel / guild
            first_voice_popout: layerContainer__59d0d anchored above account panel
            microphone_state_after_join: unmuted
          stale_session_timeout_seconds: 20
      overlay_authority: OverlayManager
actors:
  anonymous:
    permissions:
      - auth.begin
  pending:
    permissions:
      - session.read
      - session.logout
      - shell.read
      - email.resend
      - email.verify.refresh
      - email.change
      - friend.request.create
      - friend.request.read
      - friend.request.cancel
      - friend.request.accept
      - friend.request.ignore
      - guild.create
      - guild.read
      - voice.connect
  user:
    permissions:
      - session.read
      - session.logout
      - shell.read
      - friend.request.create
      - friend.request.read
      - friend.request.cancel
      - friend.request.accept
      - friend.request.ignore
      - guild.create
      - guild.read
      - voice.connect
  admin:
    permissions:
      - session.read
      - session.logout
      - admin.access
      - admin.write
security:
  session_identity_source: server-side opaque session
  authorization_source: lib/discord_app/access.py Policy
  browser_role_input_trusted: false
  confirmation_email_source: server-side session email
  username_source: validated provider/profile data
  default: deny
persistence:
  supabase_postgresql:
    schemas:
      public:
        ownership: application_data
        api_exposed_by_default: true
      auth:
        ownership: supabase_managed
        direct_admin_write: deny
      app_private:
        ownership: application_private
        api_exposed: false
        tables:
          - schema_migrations
          - email_delivery_events
      public_tables:
        - profiles
        - friend_requests
        - guilds
        - guild_members
        - guild_channels
        - voice_sessions
        - voice_signals
    migrations:
      ledger: app_private.schema_migrations
      checksum: sha256
      checksum_mismatch: deny
  local_control_sqlite:
    path: instance/control.sqlite3
    purpose:
      - local_admin_identity
      - opaque_sessions
      - encrypted_secrets
      - local_rate_limits
      - hmac_audit_chain
    exposed_to_supabase_data_api: false
email_delivery:
  active_provider: supabase
  future_provider: gmail_api
  gmail:
    enabled: false
    oauth_flow: server_side
    scope: https://www.googleapis.com/auth/gmail.send
    secret_storage: encrypted_local_control_store
    gmail_password_storage: forbidden



session_liveness:
  authority: supabase_auth_users
  interval_ms: 3000
  deleted_user: revoke_all_local_browser_sessions
  validation_unavailable: default_deny

direct_messages:
  close_projection:
    - private_channel_row
    - guild_list_unread_dm_tile
  persistence: browser_local_storage_until_real_dm_model_exists

session_runtime_v3_9:
  source_of_truth:
    actor: server-side browser session + centralized Policy
    account_exists: Supabase auth.users where deleted_at is null
    browser_storage_authority: false
  browser_contract:
    opaque_cookie:
      name: app_sid
      http_only: true
      secure: true
      same_site: Strict
    presence_cookie:
      name: app_presence
      http_only: false
      secure: true
      same_site: Strict
      value: HMAC-bound to app_sid with a domain-separated server key
      secret: false
    require_pair: true
    stale_auth_version: deny
  lifecycle:
    auth_version: 2
    login: rotate opaque browser session and issue the paired cookies
    logout: revoke local server session and delete both cookies
    browser_cookie_clear:
      cookie_store_event: immediate when supported
      fallback_events: [focus, pageshow, visibilitychange, online, protected_request]
      periodic_polling: false
      result: redirect / and deny protected requests
    user_delete_via_admin:
      local_sessions: revoke immediately by user_id
      browser_signal: BroadcastChannel/localStorage event when logout is browser-originated
    user_delete_external:
      server_identity_lease_ms: 750
      single_flight: true
      result: deny on the next authoritative browser activity or protected request
  performance:
    channels_session_bootstrap: server-rendered inert JSON; no initial session API round trip
    session_polling: none while idle
    friend_request_polling: none while idle
    spa_navigation: History API; only route sidebar, main page and compact title are replaced
    persistent_shell: guild rail and account/avatar panel remain mounted
    guild_switch_db: current guild and channel list use one pooled PostgreSQL connection; full guild list is skipped on SPA switches
    route_cache: up to 8 visited channel routes for 60 seconds
    verification_status_on_boot: false
    sqlite_session_read_writes: false
    postgres_connections: bounded lazy LIFO pool size 4
    duplicate_identity_checks: coalesced per user
